name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - run: python site/build.py --check-readme
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  autoria:
    # DCO y coautoría de los commits del PR (GOVERNANCE, regla 8)
    if: github.event_name == 'pull_request'
    uses: ELYOS-Racing/.github/.github/workflows/autoria.yml@main

  ci-ok:
    # Único check obligatorio de la rama: pasa si cada job pasó o se saltó.
    if: always()
    needs: [build, autoria]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::un job terminó en $r"; exit 1 ;; esac
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
